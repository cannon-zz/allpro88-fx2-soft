format: 1
description: 4-wide AND-OR-invert gates, expandable ('53), TTL-H not TTL-L TTL-LS
comment: 7454 is the same as 7453 but instead of the "x" and "~x" inputs has two pins that must be left disconnected.  Since we don't test those pins and leave them floating we can use this file for both parts.
