# 1X and ~1X inputs are not normal logic inputs, they are to be connected
# to the collector and emitter, respectively, of an NPN transistor in the
# output stage of a 7460.  they are left floating if not used.  their
# function is not tested here, but since they connect directly to internal
# circuits within the gates the assumption is that unless they are
# physically disconnected if the gates are behaving correctly then the
# functions of these pins must also be working.
format: 1
description: Dual 2-wide 2-input AND-OR-invert gates, expandable
packages:
  A:
    socket_name: DIP14
    pinout: 1A 2A 2B 2C 2D 2Y G 1Y 1C 1D 1X ~1X 1B V
  B:
    socket_name: DIP14
    pinout: 1X ~1X 1A V 1B 2A 2B 2C 2D 2Y G 1Y 1C 1D
vector_labels: 1X ~1X 1A 1B 1C 1D 2A 2B 2C 2D 1Y 2Y
test_vectors:
- XXIIIIIIIIOO
- - --0000000011
