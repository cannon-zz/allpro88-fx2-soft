# 7454 is the same as 7453 but instead of the X and ~X inputs has two pins
# that must be left disconnected.  since we don't test the X and ~X pin
# functions here we can use this file for both parts
format: 1
description: 4-wide AND-OR-invert gates, expandable ('53), not TTL-H TTL-L TTL-LS
packages:
  A:
    socket_name: DIP14
    pinout: A C D E F X G Y g H x ~x B V
  B:
    socket_name: DIP14
    pinout: x ~x A V B C D E F X G Y g H
vector_labels: x ~x A B C D E F g H Y
test_vectors:
- XXIIIIIIIIO
- - --000000001
